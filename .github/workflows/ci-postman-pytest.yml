name: CI — Tests (pytest + Postman/Newman)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and run services (Docker Compose)
        run: |
          cd software_engineering
          docker compose up -d --build

      - name: Wait for API to become healthy
        run: |
          # Adjust port if your APP_PORT differs; default here is 8000
          for i in {1..60}; do
            if curl -sSf http://localhost:8000/health; then
              echo "API is up"; break
            fi
            sleep 1
          done

      - name: Run unit tests (pytest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r software_engineering/docker/requirements.txt
          python -m pip install pytest httpx
          pytest -q

      - name: Setup Node.js for Newman
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection (Newman)
        run: |
          # tests/postman_collection.json and environment file are at repository root
          npx newman run tests/postman_collection.json -e tests/postman_environment.json --reporters cli,junit --reporter-junit-export newman.xml

      - name: Tear down Docker Compose
        if: always()
        run: |
          cd software_engineering
          docker compose down
